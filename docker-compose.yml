name: blitzpilot

services:
  postgres:
    image: postgres:18-alpine
    container_name: blitzpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blitzpilot
      POSTGRES_PASSWORD: blitzpilot
      POSTGRES_DB: blitzpilot
    ports:
      - "5433:5432"
    volumes:
      - blitzpilot_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blitzpilot -d blitzpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  blitzpilot_pgdata:
    name: blitzpilot_pgdata
